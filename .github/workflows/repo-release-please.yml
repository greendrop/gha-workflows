---
# release-please で Conventional Commits からバージョン・CHANGELOG・タグ・GitHub Release を作る
#
# - main への push でリリース PR を作成・更新し、リリース PR をマージするとタグ（vX.Y.Z）と GitHub Release を作る
# - 設定: release-please-config.json / .release-please-manifest.json
# - GITHUB_TOKEN で作った PR では他のワークフローが起動せず必須チェックが通らないため、GitHub App のトークンを使う
# - 必要な設定:
#   - secrets.GH_APPS_PULL_REQUEST_CREATE_CLIENT_ID / secrets.GH_APPS_PULL_REQUEST_CREATE_PRIVATE_KEY: PR 作成用の GitHub App
# - https://github.com/googleapis/release-please-action
name: repo-release-please

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APPS_PULL_REQUEST_CREATE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APPS_PULL_REQUEST_CREATE_PRIVATE_KEY }}
          permission-contents: write
          # リリース PR のラベル（autorelease: pending など）の作成・付け替えも pull-requests の権限で行える
          # （PR 作成用の GitHub App には issues の権限が無いため要求しない）
          permission-pull-requests: write

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
