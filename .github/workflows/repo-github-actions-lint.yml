---
# このリポジトリのワークフロー・composite action を静的解析する（actions/github-actions-lint を使う）
name: repo-github-actions-lint

on:
  pull_request:
    paths:
      - .github/workflows/*.yaml
      - .github/workflows/*.yml
      - actions/**
      - mise.toml
      - mise.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  github-actions-lint:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run github-actions-lint
        uses: ./actions/github-actions-lint

      # composite action は actions/github-actions-lint の対象外（ghalint run はワークフローだけを見る）なので、ここで lint する
      - name: Run ghalint for composite actions
        run: ghalint run-action actions/*/action.yml actions/*/*/action.yml
