---
# betterleaks で PR の差分コミットから秘密情報を検出する（reusable workflow）
#
# - betterleaks: https://github.com/betterleaks/betterleaks
# - pull_request イベントのワークフローから呼び出す
# - 呼び出し側のリポジトリの mise.toml に betterleaks を入れておく
#   （lefthook の pre-commit と同じバージョンで検出するため、呼び出し側の mise.toml / mise.lock を使う）
#
# 呼び出し例:
#   on:
#     pull_request:
#   jobs:
#     secret-scan:
#       permissions:
#         contents: read
#       uses: greendrop/gha-workflows/.github/workflows/secret-scan.yml@<sha> # vX.Y.Z
name: secret-scan

on:
  workflow_call:

jobs:
  secret-scan:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: betterleaks

      - name: Run betterleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          betterleaks git --redact --verbose --no-banner \
            --log-opts="--no-merges ${MERGE_BASE}..${HEAD_SHA}"
