---
# このリポジトリの PR で秘密情報を検出する（reusable workflow の secret-scan.yml を使う）
name: repo-secret-scan

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # チェック名は「secret-scan / secret-scan」になる（github-terraform の ruleset で必須にしている）
  secret-scan:
    permissions:
      contents: read
    # actionlint が自リポジトリ参照の構文（$/...）に未対応のため、./... で参照する
    uses: ./.github/workflows/secret-scan.yml # zizmor: ignore[self-repository]
