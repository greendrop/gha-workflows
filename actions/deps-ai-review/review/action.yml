---
# deps-ai-review の review ジョブ（composite action）
#
# Renovate の更新 PR を AI エージェントでレビューする deps-ai-review の 2 つ目のジョブ。
# prepare ジョブのデータを受け取り、AI エージェント（anthropics/claude-code-action）でレビューする。
#
# - AI エージェントには読み取り権限だけを渡す（プロンプトインジェクションでコメント・コミット・ラベル操作をさせない）
#   - ジョブの permissions: contents / pull-requests / issues の read
# - 読み取り系のツール（Read・Grep・Glob）だけを許可し、ファイルの変更・コマンド実行・ネットワークを禁止する
# - 呼び出し側で事前に用意するもの:
#   - actions/checkout（persist-credentials: false）
#   - 依存のインストール（任意。新しいバージョンの CHANGELOG・型定義などを AI エージェントが読めるようにする）
# - 判定結果は artifact（deps-ai-review-review）で finalize ジョブに渡す
#
# 呼び出し例は README を参照
name: deps-ai-review-review
description: deps-ai-review の review ジョブ。AI エージェントで依存の更新 PR をレビューする

inputs:
  claude-code-oauth-token:
    description: Claude の OAuth トークン（Pro / Max プランで claude setup-token で発行）
    required: true
  dependencies-installed:
    description: PR の依存パッケージをインストールできたか（true のとき、インストール先の CHANGELOG・型定義なども読むよう AI エージェントに伝える）
    required: false
    default: "false"
  instructions:
    description: AI エージェントに伝える、このリポジトリについての補足（フレームワーク・設定ファイル・検索から除くディレクトリなど）
    required: false
    default: ""
  claude-model:
    description: AI エージェントのモデル（未指定なら Claude Code の既定）
    required: false
    default: ""
  github-token:
    description: AI エージェントに渡す GitHub のトークン（読み取り権限だけのもの）
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check prerequisites
      shell: bash
      run: |
        set -euo pipefail
        if ! git -C "$GITHUB_WORKSPACE" rev-parse --git-dir > /dev/null 2>&1; then
          echo "::error::リポジトリが checkout されていません。このアクションの前に actions/checkout を実行してください"
          exit 1
        fi

    - name: Download prepared data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: deps-ai-review-prepare
        path: ${{ runner.temp }}/deps-ai-review

    - name: Build review prompt
      id: prompt
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        LIB: ${{ github.action_path }}/../lib.cjs
        DEPENDENCIES_INSTALLED: ${{ inputs.dependencies-installed }}
        INSTRUCTIONS: ${{ inputs.instructions }}
        CLAUDE_MODEL: ${{ inputs.claude-model }}
      with:
        script: |
          const lib = require(process.env.LIB)
          await lib.run({ github, context, core }, async () => {
            const pr = lib.readJson('pr.json')
            const { dependencies, usage } = lib.readJson('context.json')
            const { lockfiles, diff } = lib.buildLlmDiff(lib.readJson('files.json', []))
            const prompt = lib.buildReviewPrompt({
              title: pr.title,
              body: pr.body,
              lockfiles,
              diff,
              dependencies,
              usage: usage.text,
              dependenciesInstalled: process.env.DEPENDENCIES_INSTALLED === 'true',
              instructions: process.env.INSTRUCTIONS
            })
            core.setOutput('prompt', prompt)
            core.setOutput('claude-args', lib.buildClaudeArgs({ model: process.env.CLAUDE_MODEL }))
          })

    # - 読み取り系のツール（Read・Grep・Glob）だけを許可し、ファイルの変更・コマンド実行・ネットワークを禁止する
    # - GitHub のトークンは読み取り権限だけ（呼び出し側のジョブの permissions）
    # - Renovate が作成・更新した PR でも実行できるように、renovate[bot] を許可する
    #   （書き込み権限のあるユーザーは既定で許可される）
    - name: Review with Claude
      id: claude
      uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: renovate[bot]
        prompt: ${{ steps.prompt.outputs.prompt }}
        claude_args: ${{ steps.prompt.outputs.claude-args }}
        # 実行環境の秘密情報（プロセスの環境変数・Claude の認証情報）を読めないようにする
        settings: |
          {
            "permissions": {
              "deny": ["Read(//proc/**)", "Read(~/.claude/**)", "Read(~/.config/**)"]
            }
          }

    # 出力にシークレットの値が含まれていたら伏せてから、判定結果として保存する
    - name: Parse review result
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        LIB: ${{ github.action_path }}/../lib.cjs
        STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        GITHUB_TOKEN_VALUE: ${{ inputs.github-token }}
      with:
        script: |
          const lib = require(process.env.LIB)
          await lib.run({ github, context, core }, async () => {
            const { dependencies, usage } = lib.readJson('context.json')
            const review = lib.redactSecrets(lib.parseReview(process.env.STRUCTURED_OUTPUT), [
              process.env.CLAUDE_CODE_OAUTH_TOKEN,
              process.env.GITHUB_TOKEN_VALUE
            ])
            lib.writeJson('review.json', { ...review, dependencies, context_files: usage.files })
            core.info(`verdict: ${review.verdict} (confidence: ${review.confidence})`)
          })

    - name: Upload review result
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: deps-ai-review-review
        path: |
          ${{ runner.temp }}/deps-ai-review/review.json
          ${{ runner.temp }}/deps-ai-review/error.json
        retention-days: 1
        if-no-files-found: ignore
        overwrite: true
